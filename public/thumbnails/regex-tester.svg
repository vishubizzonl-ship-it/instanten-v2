<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" aria-label="Regex Tester thumbnail">
  <rect width="640" height="360" fill="#F0F2FF" />
  <rect x="60" y="60" width="520" height="240" rx="8" fill="#FFFFFF" stroke="#E1E1E8" stroke-width="1"/>
  <text x="100" y="110" font-family="DM Sans, sans-serif" font-size="14" font-weight="500" fill="#828282">Pattern</text>
  <text x="100" y="140" font-family="DM Sans, sans-serif" font-size="16" font-family="monospace" fill="#29294B">/^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/i</text>
  <text x="100" y="190" font-family="DM Sans, sans-serif" font-size="14" font-weight="500" fill="#828282">Test String</text>
  <text x="100" y="220" font-family="DM Sans, sans-serif" font-size="16" font-family="monospace" fill="#514DCC">user@example.com</text>
  <rect x="100" y="250" width="180" height="32" rx="6" fill="#9895FF" opacity="0.15" stroke="#9895FF" stroke-width="1"/>
  <text x="190" y="270" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="14" font-weight="600" fill="#514DCC" dominant-baseline="middle">Match Found</text>
  <text x="320" y="330" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="28" font-weight="600" fill="#29294B" letter-spacing="-0.5">Regex Tester</text>
</svg>