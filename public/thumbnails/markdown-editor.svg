<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" aria-label="Markdown Editor thumbnail">
  <rect width="640" height="360" fill="#F0F2FF" />
  <rect x="60" y="60" width="240" height="240" rx="8" fill="#FFFFFF" stroke="#E1E1E8" stroke-width="1"/>
  <text x="180" y="100" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="14" font-weight="500" fill="#828282">Editor</text>
  <text x="100" y="130" font-family="DM Sans, sans-serif" font-size="14" font-family="monospace" fill="#29294B"># Heading</text>
  <text x="100" y="160" font-family="DM Sans, sans-serif" font-size="14" font-family="monospace" fill="#514DCC">**Bold** and *italic*</text>
  <text x="100" y="190" font-family="DM Sans, sans-serif" font-size="14" font-family="monospace" fill="#9895FF">- List item</text>
  <text x="100" y="220" font-family="DM Sans, sans-serif" font-size="14" font-family="monospace" fill="#9895FF">- Another item</text>
  <path d="M320 140 L320 220" stroke="#9895FF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9895FF" />
    </marker>
  </defs>
  <rect x="360" y="60" width="240" height="240" rx="8" fill="#FFFFFF" stroke="#E1E1E8" stroke-width="1"/>
  <text x="480" y="100" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="14" font-weight="500" fill="#828282">Preview</text>
  <text x="400" y="130" font-family="DM Sans, sans-serif" font-size="20" font-weight="600" fill="#29294B">Heading</text>
  <text x="400" y="160" font-family="DM Sans, sans-serif" font-size="14" fill="#29294B"><tspan font-weight="600">Bold</tspan> and <tspan font-style="italic">italic</tspan></text>
  <text x="400" y="190" font-family="DM Sans, sans-serif" font-size="14" fill="#29294B">• List item</text>
  <text x="400" y="220" font-family="DM Sans, sans-serif" font-size="14" fill="#29294B">• Another item</text>
  <text x="320" y="330" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="28" font-weight="600" fill="#29294B" letter-spacing="-0.5">Markdown Editor</text>
</svg>