<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" aria-label="Base64 Encoder thumbnail">
  <rect width="640" height="360" fill="#F0F2FF" />
  <rect x="60" y="60" width="240" height="240" rx="8" fill="#FFFFFF" stroke="#E1E1E8" stroke-width="1"/>
  <text x="180" y="130" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="14" font-weight="500" fill="#828282">Input</text>
  <text x="180" y="160" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="16" fill="#29294B">Hello World</text>
  <path d="M320 140 L320 220" stroke="#9895FF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9895FF" />
    </marker>
  </defs>
  <rect x="360" y="60" width="240" height="240" rx="8" fill="#FFFFFF" stroke="#E1E1E8" stroke-width="1"/>
  <text x="480" y="130" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="14" font-weight="500" fill="#828282">Output</text>
  <text x="480" y="160" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="16" fill="#514DCC">SGVsbG8gV29ybGQ=</text>
  <text x="320" y="330" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="28" font-weight="600" fill="#29294B" letter-spacing="-0.5">Base64 Encoder</text>
</svg>